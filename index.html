<style>
@font-face{font-family:'EB Garamond';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/ebgaramond-400.woff2') format('woff2')}
@font-face{font-family:'EB Garamond';font-style:italic;font-weight:400;font-display:swap;src:url('fonts/ebgaramond-400-italic.woff2') format('woff2')}
@font-face{font-family:'EB Garamond';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/ebgaramond-onum-400.woff2') format('woff2');unicode-range:U+0030-0039}
@font-face{font-family:'EB Garamond';font-style:italic;font-weight:400;font-display:swap;src:url('fonts/ebgaramond-onum-400-italic.woff2') format('woff2');unicode-range:U+0030-0039}
:root{--paper:#f4f0e8;--ink:#141210;--quiet:#6b665f;--edge:clamp(24px,4.2vw,72px)}
*{box-sizing:border-box}html,body{margin:0}
body{height:100vh;height:100svh;min-height:360px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--paper);color:var(--ink);font-family:'EB Garamond',Georgia,serif;-webkit-font-smoothing:antialiased}
::selection{color:var(--ink);background:#e4ddd0}
a{color:inherit;text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
header,footer{display:flex;justify-content:space-between;align-items:center;padding:max(22px,env(safe-area-inset-top)) var(--edge) 0}
footer{padding:8px var(--edge) max(22px,env(safe-area-inset-bottom))}
.name{font-size:25px;letter-spacing:-.02em}.about{font-size:21px}
.who{display:flex;align-items:baseline;gap:14px;min-width:0}
.hint{font-size:15px;font-style:italic;color:var(--quiet);white-space:nowrap;opacity:0;transform:translateX(-6px);transition:opacity .35s ease,transform .35s ease;pointer-events:none}
.who:hover .hint,.name:focus-visible+.hint{opacity:1;transform:none}
@media (hover:none){.hint{opacity:1;transform:none}}
@view-transition{navigation:auto}
::view-transition-old(root),::view-transition-new(root){animation-duration:.45s;animation-timing-function:ease}
@media (prefers-reduced-motion:reduce){@view-transition{navigation:none}.hint{transition:none}}
.stage{display:grid;place-items:center;min-height:0;padding:12px var(--edge)}
/* 4:3 frame, as large as fits */
.film{position:relative;width:min(100%,calc((100svh - 170px)*4/3));aspect-ratio:4/3;overflow:hidden;
  mix-blend-mode:multiply;filter:grayscale(1) contrast(1.45) brightness(1.08)}
.film video{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.film::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 40px 18px var(--paper);pointer-events:none}
.film{opacity:0;transition:opacity 1s ease}
.stage{position:relative}
.wait{position:absolute;inset:0;display:grid;place-items:center;font-style:italic;font-size:22px;letter-spacing:.01em;color:var(--quiet);opacity:0;transition:opacity .8s ease;pointer-events:none}
.wait.is-on{opacity:.75}
.film.is-visible~.wait{opacity:0;transition-duration:.6s}
.film.is-visible{opacity:1}
footer{align-items:center;font-size:13px;color:var(--quiet);letter-spacing:.01em}
.copyright{white-space:nowrap}
.foot-right{display:flex;align-items:center;gap:18px}
.credit{text-align:right;line-height:1.35;font-style:normal;white-space:nowrap}
.credit cite{font-style:italic}
.stage.is-tap{cursor:pointer}
@media (prefers-reduced-motion: reduce){.film{transition:none}}
@media (max-width:600px){footer{flex-direction:column-reverse;align-items:flex-start;gap:2px}.credit{text-align:left;font-size:clamp(8px,2.8vw,13px)}.foot-right{width:100%;justify-content:space-between}}
@media (max-width:960px){.who{flex-direction:column;gap:0}.hint{white-space:normal;max-width:34ch;line-height:1.35;margin-top:3px}header{align-items:baseline}}
@media (max-width:600px){.hint{font-size:14px;max-width:42ch}.stage{padding-inline:16px}.film{width:min(100%,calc((100svh - 190px)*4/3))}.wait{font-size:19px}}
@media (max-height:480px) and (orientation:landscape){body{min-height:0}header{padding-top:max(10px,env(safe-area-inset-top))}footer{padding-bottom:max(8px,env(safe-area-inset-bottom));padding-top:0}.stage{padding-block:4px}.film{width:min(100%,calc((100svh - 124px)*4/3))}.name{font-size:21px}.about{font-size:18px}.hint{display:none}}
/* Apple engine (Safari, every iPhone browser): blending is ignored on embedded video, so the film's white
   cannot take on the paper. Make this page's paper the film's white instead, so the frame disappears. */
.webkit{--paper:#fff}
.webkit .film{mix-blend-mode:normal;filter:none}
/* No filter to clean the old print's grey edges there, so fade a wider white margin over them. */
.webkit .film::after{box-shadow:inset 0 0 36px 22px #fff;background:linear-gradient(to top,#fff 4%,rgba(255,255,255,0) 26%)}
@media (max-width:600px){.webkit .film::after{box-shadow:inset 0 0 18px 8px #fff}}

<body>
<header><span class="who"><a class="name" href="index.html" aria-current="page">Junjie Xiong</a></span><a class="about" href="about.html">About</a></header>
<main class="stage" aria-label="Sisyphus (1974) by Marcell Jankovics">
  <div class="film" id="film"><video id="player" muted playsinline loop preload="metadata" poster="media/sisyphus-poster.jpg" tabindex="-1" aria-hidden="true"><source src="media/sisyphus-loop-1080p.mp4" type="video/mp4"></video></div>
  <span class="wait" id="wait" aria-hidden="true">Sisyphus</span>
</main>
<footer>
  <span class="copyright">&copy; 2026 Junjie Xiong</span>
  <span class="foot-right">
    <span class="credit">In the midst of winter, I found there was, within me, an invincible summer</span>
  </span>
</footer>
<script>
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const film=document.getElementById('film'),player=document.getElementById('player'),stage=film.parentElement;
  let playing=!reduce;
  player.muted=true;
  const show=()=>film.classList.add('is-visible');
  const waitTap=()=>{playing=false;stage.classList.add('is-tap');show();};
  function play(){playing=true;stage.classList.remove('is-tap');player.play().catch(waitTap);}
  function start(e){if(!player.paused||(e&&e.target.closest('a')))return;play();}
  player.addEventListener('playing',show);
  player.addEventListener('loadeddata',()=>{if(!playing)show();});
  player.addEventListener('error',()=>{document.getElementById('wait').textContent='Film unavailable';document.getElementById('wait').classList.add('is-on');film.classList.remove('is-visible');});
  document.addEventListener('click',start);
  document.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&!e.target.closest('a')&&player.paused){e.preventDefault();start(e);}});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&playing&&player.paused)play();});
  if(reduce)waitTap();else play();
  setTimeout(()=>{if(!film.classList.contains('is-visible'))document.getElementById('wait').classList.add('is-on');},600);
</script>
