# Jekyll configuration (GitHub Pages builds this automatically on push).
title: Junjie Xiong
url: "https://junjiearaoxiong.github.io"
# Blog posts (files in _posts/) are published at /posts/<title>/
permalink: /posts/:title/
# Auto-generate /sitemap.xml for search engines (supported by GitHub Pages)
plugins:
  - jekyll-sitemap

# Keep the direct-link recruiting notebook out of the generated public sitemap.
# The pages also carry noindex metadata; they remain publicly reachable by URL.
defaults:
  - scope:
      path: "recruiting/"
    values:
      sitemap: false
